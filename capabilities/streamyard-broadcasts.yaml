      path: /broadcasts
      operations:
      - name: listbroadcasts
        method: GET
        description: List Broadcasts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
          description: Page number for pagination
        - name: perPage
          in: query
          type: integer
          description: Number of broadcasts per page (max 100)
      - name: createbroadcast
        method: POST
        description: Create Broadcast
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: broadcasts-broadcastId
      path: /broadcasts/{broadcastId}
      operations:
      - name: getbroadcast
        method: GET
        description: Get Broadcast
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatebroadcast
        method: PATCH
        description: Update Broadcast
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletebroadcast
        method: DELETE
        description: Delete Broadcast
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
