apis:
  - aid: streamyard:streamyard-api
    name: StreamYard API
    description: The StreamYard API provides programmatic access to manage live broadcasts and recordings. Create and manage
      broadcasts, add streaming destinations (YouTube, Facebook, LinkedIn, Twitch, Twitter/X, custom RTMP), access recordings,
      and manage connected destination accounts. Authentication uses OAuth 2.0 with scope-based access control.
