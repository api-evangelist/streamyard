aid: streamyard
name: StreamYard
description: StreamYard is a professional live streaming and recording studio in the browser. Stream directly to multiple
  platforms simultaneously including YouTube, Facebook, LinkedIn, Twitch, and Twitter/X. Interview remote guests, share screens,
  display overlays, and manage brand assets. The StreamYard API enables programmatic management of broadcasts, destinations,
  and recordings.
